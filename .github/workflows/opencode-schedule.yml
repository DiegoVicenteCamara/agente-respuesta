name: opencode-schedule

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  OPENCODE_VERSION: v1.18.32
  MODEL: opencode/muse-spark-1.3-contributor-free

jobs:
  opencode:
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-schedule
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENCODE_VERSION }}

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version ${{ env.OPENCODE_VERSION }}

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run opencode
        shell: bash
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: |
            Process the oldest open issue labeled `agent-ready` that has no open
            pull request and no `agent-in-progress` label. Use the `gh` CLI
            (authenticated via GH_TOKEN) to discover and update the issue.

            Steps:
            1. Reassign labels: remove `agent-ready`, add `agent-in-progress`.
            2. Implement exactly ONE issue. Follow AGENTS.md and its skills.
            3. Install dependencies (pip install -r backend/requirements.txt),
               run `python -m pytest -q` and do not finish until green. Add tests
               for the new behavior.
            4. If the issue cannot be implemented (unclear or blocked), swap the
               labels back to `agent-ready` and leave a comment explaining why.

            Report a summary of what you did in your response; branch creation,
            push and PR creation are handled automatically for you.